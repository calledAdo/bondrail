# Slice on-chain history, indexed by Envio HyperIndex.
# Event rows use chain:block:tx:logIndex; x402 payments use chain:asset:payer:nonce to correlate logs.

# One business's SliceAccount: its revenue address and payment entrypoint from day one.
type Issuer {
  id: ID! # account address
  chainId: Int!
  issuer: String! @index
  asset: String! # the token the account earns, raises and repays in
  tier: Int # 0 Native, 1 Watched; Native once a project is bound, otherwise known at the first bond
  project: String @index # Native project bound to the account
  projectApproved: Boolean # reviewer-approved as Native (individually, or via its template)
  template: String @index # creation-code hash of the reviewed template it was deployed from
  activeBond: String
  grossRevenue: BigInt!
  volume: BigInt! # collected gross payments (in and out) plus account settlements
  toInvestors: BigInt!
  toIssuer: BigInt!
  payments: Int!
  createdAt: BigInt!
  firstRevenueAt: BigInt
}

# An issuer's treasury wallet -> its account.
type Treasury {
  id: ID! # issuer wallet address
  accounts: [String!]! # every account this wallet issued (one issuer can run several)
}

# One per (issuer account, wallet) pair once that issuer's treasury has sent the wallet the asset. A wallet
# funded by several issuers has several links; each FundingEdge is one underlying transfer.
type FundingLink {
  id: ID! # `${account}-${wallet}`
  account: String! @index
  wallet: String! @index
  amount: BigInt!
}

type Bond {
  id: ID! # bond address
  chainId: Int!
  account: String! @index
  issuer: String!
  adapter: Int!
  policyHash: String!
  phase: Int! # 0 Funding, 1 Active, 2 Closing, 3 Closed, 4 Cancelled
  raised: BigInt!
  released: BigInt!
  undrawn: BigInt!
  principalRecovery: BigInt!
  revenueCollected: BigInt!
  stakeRecovery: BigInt!
  pool: BigInt!
  redeemed: BigInt!
  totalSupply: BigInt!
  effectiveCap: BigInt!
  defaulted: Boolean!
  triggered: Boolean!
  createdAt: BigInt!
}

type Holder {
  id: ID! # bond-holder
  bond: String! @index
  holder: String! @index
  balance: BigInt!
}

# A USDC transfer into an account (the raw receipt behind an x402 payment or an unclassified inflow).
type Receipt {
  id: ID!
  chainId: Int!
  account: String! @index
  sender: String!
  amount: BigInt!
  block: BigInt!
  blockHash: String!
  txHash: String! @index
  logIndex: Int!
  timestamp: BigInt!
}

# A revenue payment attributed to a payer, exactly once per payment:
#   native    account Revenue event from collect(): the payer is proven by the pull
#   x402      EIP-3009 settlement into an account (AuthorizationUsed in the same tx): the payer signed it
#   transfer  any other USDC transfer into an account: unclassified, never verified revenue
type Payment {
  id: ID!
  chainId: Int!
  account: String! @index
  receiptId: String!
  payer: String! @index
  amount: BigInt!
  timestamp: BigInt! @index
  source: String! # native | transfer | x402
  synthetic: Boolean!
  related: Boolean!
  evidenceComplete: Boolean!
  reasons: [String!]!
  txHash: String!
}

# USDC sent from an issuer's treasury (issuer or payout wallet) to another wallet.
type FundingEdge {
  id: ID!
  chainId: Int!
  issuerAccount: String! @index
  sender: String!
  recipient: String! @index
  amount: BigInt!
  timestamp: BigInt!
  txHash: String!
}

# How one booked payment was divided (account Revenue event).
type Split {
  id: ID!
  account: String! @index
  bond: String!
  payer: String!
  collected: Boolean!
  gross: BigInt!
  toBond: BigInt!
  toIssuer: BigInt!
  timestamp: BigInt!
  txHash: String!
}

# Every bond lifecycle event, for timelines (Deposited, Activated, RevenueReceived, Redeemed, ...).
type ChainEvent {
  id: ID!
  chainId: Int!
  address: String! @index
  kind: String!
  account: String!
  amount: BigInt!
  block: BigInt!
  blockHash: String!
  txHash: String!
  timestamp: BigInt!
}

type CovenantCheck {
  id: ID!
  chainId: Int!
  bond: String! @index
  result: Int! # 0 Unknown, 1 Compliant, 2 Violation
  epoch: BigInt!
  observedAt: BigInt!
  evidenceHash: String!
  txHash: String!
  timestamp: BigInt!
}

type DailyRevenue {
  id: ID! # account-day
  account: String! @index
  day: Int!
  gross: BigInt!
  verified: BigInt! # attributed: a proven payer with no detected link to the issuer
  x402: BigInt! # attributed x402 settlements (the revenue-drop check compares days)
  payments: Int!
}

# Per (account, payer) totals, so pages never need the full payment history.
type PayerTotal {
  id: ID! # `${account}-${payer}`
  account: String! @index
  payer: String!
  amount: BigInt!
  payments: Int!
  related: Boolean! # any payment from this payer was linked to the issuer
  reasons: [String!]!
  source: String! # the first payment's source
}

# EIP-3009 emits AuthorizationUsed immediately before Transfer. Consumed by that Transfer.
type Authorization {
  id: ID! # chain:asset:tx:authorizer
  nonce: String!
}

# Settled precedes its Revenue event, even inside a batched transaction. Consumed by Revenue.
type AccountSettlement {
  id: ID! # chain:tx:account
  payer: String!
  amount: BigInt!
}
