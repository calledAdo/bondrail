[profile.default]
src = "src"
test = "test"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
  "@bondrail/contracts/=node_modules/@bondrail/contracts/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]
