name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

# Keep these job names stable: they are the required merge checks.
# No path filters or job conditions: every change must report all four checks.
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.svm
            ~/.foundry/cache
            contracts/cache
            contracts/out
          key: ${{ runner.os }}-foundry-1.8.4-contracts-${{ hashFiles('contracts/**/*.sol', 'contracts/foundry.toml', 'demo/contracts/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-foundry-1.8.4-contracts-
      - name: Solidity formatting baseline
        # Existing sources fail forge fmt --check; enable it after a dedicated formatting change.
        run: echo 'SKIP forge fmt --check (existing formatting debt; see CONTRIBUTING.md)'
      - name: Build and check contract sizes
        run: forge build --root contracts --sizes
      - name: Unit, fuzz and invariant tests
        # Use the checked-in foundry.toml settings without CI overrides.
        run: forge test --root contracts

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.32.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            indexer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install standalone indexer workspace
        run: pnpm --dir indexer install --frozen-lockfile
      - name: Workspace and scripts tests, all typechecks, indexer codegen and tests
        run: pnpm check:typescript

  packages:
    name: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.32.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.svm
            ~/.foundry/cache
            contracts/cache
            contracts/out
          key: ${{ runner.os }}-foundry-1.8.4-packages-${{ hashFiles('contracts/**/*.sol', 'contracts/foundry.toml', 'demo/contracts/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-foundry-1.8.4-packages-
      - run: pnpm install --frozen-lockfile
      - name: Verify packed SDK in plain Node
        run: pnpm sdk:verify
      - name: Verify Solidity tarball and external Foundry consumer
        run: pnpm contracts:verify

  apps:
    name: apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.32.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/web/.next/cache
            demo/agent/.next/cache
          key: ${{ runner.os }}-next-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-node24-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Production builds for both Next apps
        run: pnpm build:apps
