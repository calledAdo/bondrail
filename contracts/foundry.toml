[profile.default]
src = "src"
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@slice/=src/",
  "@slice-demo/=../demo/contracts/",
]
# The demo contracts (../demo/contracts) are built against the protocol for tests and demo deploys.
allow_paths = ["../demo"]
[fuzz]
runs = 256
[invariant]
runs = 128
depth = 64
fail_on_revert = true
