[profile.default]
src = "src"
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
[fuzz]
runs = 256
[invariant]
runs = 128
depth = 64
fail_on_revert = true
